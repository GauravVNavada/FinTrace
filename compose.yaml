services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintrace
      POSTGRES_USER: fintrace
      POSTGRES_PASSWORD: fintrace
    ports:
      - "55432:5432"
    volumes:
      - fintrace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrace -d fintrace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fintrace-postgres-data:
