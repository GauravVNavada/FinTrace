name: FinTrace CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:ui-architecture
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fintrace
          POSTGRES_USER: fintrace
          POSTGRES_PASSWORD: fintrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fintrace -d fintrace"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check app tests
      - run: mypy app
      - name: Apply migrations and seed integration database
        env:
          DATABASE_URL: postgresql://fintrace:fintrace@127.0.0.1:5432/fintrace
          STORAGE_BACKEND: postgres
        run: |
          fintrace-migrate
          fintrace-seed --orders 100 --seed 42 --anomaly-rate 0.30 --organization-id ORG-001
      - name: Run PostgreSQL integration suite
        env:
          DATABASE_URL: postgresql://fintrace:fintrace@127.0.0.1:5432/fintrace
          FINTRACE_TEST_DATABASE_URL: postgresql://fintrace:fintrace@127.0.0.1:5432/fintrace
          STORAGE_BACKEND: postgres
        run: python -m pytest -q tests/test_postgres_integration.py
      - run: pip install pip-audit
      - run: pip-audit
